
name: 'saas_warehouse'
version: '1.0.0'
config-version: 2

profile: 'saas_warehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  saas_warehouse:

    staging:
      +schema: saas_staging
      +materialized: view

    intermediate:
      +schema: saas_intermediate
      +materialized: view

    marts:
      +schema: saas_marts
      +materialized: table