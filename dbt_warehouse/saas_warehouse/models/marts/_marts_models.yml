version: 2

models:
  - name: dim_customers
    description: SCD Type 2 customer dimension; one row per historical customer version.
    columns:
      - name: customer_version_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
  - name: dim_users
    description: Current user dimension, one row per user.
    columns:
      - name: user_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
  - name: dim_plans
    description: Current SaaS pricing plan dimension.
    columns:
      - name: plan_id
        tests: [not_null, unique]
      - name: plan_name
        tests: [not_null]
  - name: dim_date
    description: Calendar dimension spanning source dates and current date.
    columns:
      - name: date_day
        tests: [not_null, unique]
  - name: fact_subscriptions
    description: One row per subscription, including current-state MRR.
    columns:
      - name: subscription_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: plan_id
        tests: [not_null]
  - name: fact_invoices
    description: One row per invoice.
    columns:
      - name: invoice_id
        tests: [not_null, unique]
      - name: subscription_id
        tests: [not_null]
  - name: fact_payments
    description: One row per payment attempt; multiple attempts per invoice are expected.
    columns:
      - name: payment_id
        tests: [not_null, unique]
      - name: invoice_id
        tests: [not_null]
  - name: fact_product_usage
    description: One row per valid product event.
    columns:
      - name: event_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: user_id
        tests: [not_null]
      - name: event_date
        tests: [not_null]
