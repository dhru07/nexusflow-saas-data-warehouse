version: 2

models:

  - name: stg_customers
    description: >
      Cleaned customer records. Duplicate customer IDs are reduced to
      their latest ingested record.
    columns:
      - name: customer_id
        description: Unique identifier for a customer company.
        data_tests:
          - unique
          - not_null

      - name: company_name
        data_tests:
          - not_null

      - name: customer_segment
        data_tests:
          - not_null

  - name: stg_users
    description: >
      Cleaned user records, with customer relationships preserved.
    columns:
      - name: user_id
        description: Unique identifier for an individual user.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_plans
    description: Cleaned SaaS pricing plan records.
    columns:
      - name: plan_id
        data_tests:
          - unique
          - not_null

      - name: monthly_price
        data_tests:
          - not_null

      - name: billing_interval
        data_tests:
          - not_null

  - name: stg_subscriptions
    description: >
      Cleaned subscription records, including current billing period
      and cancellation attributes.
    columns:
      - name: subscription_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: plan_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_plans')
                field: plan_id

      - name: status
        data_tests:
          - not_null

  - name: stg_invoices
    description: Cleaned invoice records.
    columns:
      - name: invoice_id
        data_tests:
          - unique
          - not_null

      - name: subscription_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_subscriptions')
                field: subscription_id

      - name: total_amount
        data_tests:
          - not_null

  - name: stg_payments
    description: >
      Cleaned payment attempts. Each attempt is retained as a separate
      payment record.
    columns:
      - name: payment_id
        data_tests:
          - unique
          - not_null

      - name: invoice_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_invoices')
                field: invoice_id

      - name: status
        data_tests:
          - not_null

  - name: stg_product_events
    description: >
      Deduplicated product usage events. Intentionally invalid user
      references are retained for downstream quarantine and quality checks.
    columns:
      - name: event_id
        data_tests:
          - unique
          - not_null

      - name: user_id
        data_tests:
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: event_timestamp
        data_tests:
          - not_null

  - name: stg_support_tickets
    description: >
      Cleaned customer support ticket records.
    columns:
      - name: ticket_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: user_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_users')
                field: user_id