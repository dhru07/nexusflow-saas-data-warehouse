version: 2

sources:
  - name: saas_raw
    description: >
      Raw synthetic B2B SaaS source data ingested into BigQuery.
      Raw records are retained, including duplicates and intentionally
      invalid product events.

    database: data-engineering-course-511511
    schema: saas_raw

    tables:

      - name: customers
        description: Company-level customer records.

      - name: users
        description: Individual users belonging to customer companies.

      - name: plans
        description: SaaS pricing plans and billing configuration.

      - name: subscriptions
        description: Customer subscription records and lifecycle status.

      - name: invoices
        description: Billing invoices generated for subscriptions.

      - name: payments
        description: Payment attempts associated with invoices.

      - name: product_events
        description: >
          Product usage events generated by individual users.
          Includes intentionally invalid user references for data-quality testing.

      - name: support_tickets
        description: Customer support tickets and resolution information.